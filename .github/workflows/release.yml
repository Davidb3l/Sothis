name: Release

# Tag-triggered: build the `sothis` binary for the five supported platforms,
# archive each one, write its sha256, sign it with Sigstore (keyless OIDC) and
# publish a GitHub Release. scripts/install.sh and scripts/install.ps1 (and
# `sothis`'s own consumers) pin the expected signer to
# `release.yml@refs/tags/v<version>` of this repository.
#
# NB: a manual run must be dispatched WITH THE TAG SELECTED as the ref (the
# "Use workflow from" picker). Sigstore's keyless certificate records the ref
# the workflow ran on, and the installers pin the signer identity to
# `release.yml@refs/tags/<TAG>`. A dispatch from a branch would publish a genuine
# release that every installer then rejects, so the tag is read from the ref,
# never from an input, and the `verify` job refuses anything that is not a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Tag must equal the Cargo.toml version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::this workflow must run from a tag ref (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}); re-run it with the tag selected in 'Use workflow from'"
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not v<semver>"
            exit 1
          fi
          cargo_version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/,""); print; exit}' Cargo.toml)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version '$cargo_version'; bump Cargo.toml (and Cargo.lock) before tagging"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $version"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # required for Sigstore keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-glibc
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            use_cross: false
            smoke: true
            bin: sothis
            archive: tar.gz
          - platform: linux-arm64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            use_cross: true
            smoke: false
            bin: sothis
            archive: tar.gz
          - platform: macos-x64
            runner: macos-14
            rust_target: x86_64-apple-darwin
            use_cross: false
            smoke: false
            bin: sothis
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            use_cross: false
            smoke: true
            bin: sothis
            archive: tar.gz
          - platform: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            use_cross: false
            smoke: true
            bin: sothis.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always the ref the run was triggered on, which `verify` proved is a tag.
          ref: ${{ github.ref }}

      - name: Setup Rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build sothis (cargo)
        if: matrix.use_cross == false
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Build sothis (cross)
        if: matrix.use_cross == true
        shell: bash
        run: cross build --release --locked --target ${{ matrix.rust_target }}

      # Only where the runner can execute the target: prove the artifact reports
      # the tagged version and its embedded manifest validates.
      - name: Smoke test the built binary
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.rust_target }}/release/${{ matrix.bin }}"
          reported="$("$exe" --version)"
          echo "$reported"
          [ "$reported" = "sothis ${{ needs.verify.outputs.version }}" ]
          "$exe" manifest validate

      - name: Stage the archive contents
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          stage="sothis-${version}-${{ matrix.platform }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.bin }}" "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "archive=${stage}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Create tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ steps.stage.outputs.archive }}" "${{ steps.stage.outputs.stage }}"

      # SOT-14: Windows ships a ZIP. The top directory is part of the archive.
      - name: Create zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path '${{ steps.stage.outputs.stage }}' -DestinationPath '${{ steps.stage.outputs.archive }}'

      # `<hex> *<asset>`: the binary-mode marker that sha256sum and shasum -b
      # both print, and the format the installers require. Portable: macOS has
      # `shasum`, Linux and Git Bash on Windows have `sha256sum`.
      - name: Write the sha256
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.stage.outputs.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -b "$archive" > "${archive}.sha256"
          else
            shasum -a 256 -b "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      # ---- Sign with Sigstore (keyless OIDC) ----
      # Same pinned release as Sirius Forester's pipeline: the v3 line emits
      # `<input>.sigstore.json` bundles, which `cosign verify-blob --bundle`
      # (the installers and the Rust engine) consume.
      - name: Sign the archive with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ${{ steps.stage.outputs.archive }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.archive }}.sigstore.json
            ${{ steps.checksum.outputs.checksum }}
          # `error`, not `ignore`: the installers hard-require the .sha256 and
          # a missing .sigstore.json means an unsigned release. Fail here
          # rather than publish something no installer can verify.
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Every platform produced an archive, a checksum and a bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          for platform in linux-x64-glibc linux-arm64 macos-x64 macos-arm64; do
            for suffix in .tar.gz .tar.gz.sha256 .tar.gz.sigstore.json; do
              test -s "release-artifacts/sothis-${version}-${platform}${suffix}"
            done
          done
          for suffix in .zip .zip.sha256 .zip.sigstore.json; do
            test -s "release-artifacts/sothis-${version}-windows-x64${suffix}"
          done
          ls -l release-artifacts

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" release-artifacts/* \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "${prerelease[@]}"
          fi
