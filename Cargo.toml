[package]
name = "sothis"
version = "0.1.0"
edition = "2021"
description = "The distribution and compatibility CLI for the Sothis suite"
license = "MIT"
repository = "https://github.com/Davidb3l/Sothis"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
regex = "1"

[profile.release]
strip = true
lto = "thin"
